name: lab1-compose

services:
  database:
    image: redis:7-alpine
    networks:
      - back
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 1s
      retries: 5
      start_period: 5s


  app:
    build: ./app
    image: lab1-app:1.0
    networks:
      - front
      - back
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "\"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/test', timeout=1).read() \""]
      interval: 3s
      timeout: 1s
      retries: 5
      start_period: 5s

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - front
    depends_on:
      app:
        condition: service_healthy

networks:
  front:
    name: lab1-front
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.1.0/24
          gateway: 172.28.1.1

  back:
    name: lab1-back
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.2.0/24
          gateway: 172.28.2.1

volumes:
  redis-data:
