name: lab1-compose

services:
  database:
    image: redis:7-alpine
    networks:
      - lab
    volumes:
      - redis-data:/data

  app:
    build: ./app
    image: lab1-app:1.0
    networks:
      - lab
    depends_on:
      - database

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - lab
    depends_on:
      - app

networks:
  lab:
    name: lab1
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
          gateway: 172.28.0.1

volumes:
  redis-data:
